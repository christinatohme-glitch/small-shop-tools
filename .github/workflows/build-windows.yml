name: Build Northstar Shop Tools for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "main.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Northstar-Shop-Tools-Windows-Installer
          path: dist/Northstar-Shop-Tools-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
