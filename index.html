<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northstar Shop Tools</title>
<style>
:root{--navy:#14243a;--blue:#2f6fed;--bg:#f4f7fb;--card:#fff;--text:#172335;--muted:#68778b;--line:#e2e8f0;--green:#16865c;--red:#c63d4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Segoe UI',Arial,sans-serif}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:white;padding:26px 16px}.brand{font-size:20px;font-weight:750;letter-spacing:.2px;margin:0 10px 4px}.tag{color:#b9c8da;font-size:12px;margin:0 10px 28px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#dce5f1;border:0;text-align:left;padding:12px 14px;border-radius:10px;font-size:14px;cursor:pointer}.nav button.active,.nav button:hover{background:#2b3e57;color:white}.sidefoot{margin:35px 10px 0;color:#aebed0;font-size:12px}.main{padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}.top h1{font-size:26px;margin:0}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:600;color:var(--text)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #17233508}.metric-label{color:var(--muted);font-size:13px}.metric{font-size:27px;font-weight:750;margin-top:9px;letter-spacing:-.5px}.metric-note{font-size:12px;color:var(--muted);margin-top:4px}.section-title{font-size:17px;margin:0 0 14px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px 10px;font-size:13px}th{color:var(--muted);font-weight:650;background:#fafbfd}td .btn{padding:5px 8px;font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}label{display:grid;gap:6px;font-size:13px;color:#44536a}input,select,textarea{font:inherit;padding:10px 11px;border:1px solid #d4deea;border-radius:8px;background:#fff;color:var(--text);min-width:0;width:100%}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hidden{display:none!important}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#e8f7ef;color:var(--green)}.pill.low{background:#fff1d9;color:#95610b}.notice{background:#edf4ff;color:#2b4e83;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.barrow{display:grid;grid-template-columns:105px 1fr 85px;gap:10px;align-items:center;margin:13px 0;font-size:13px}.barbg{height:9px;background:#edf1f7;border-radius:8px;overflow:hidden}.barfill{height:100%;background:var(--blue);border-radius:8px}.footer{color:var(--muted);font-size:12px;margin:20px 2px}.search{max-width:280px}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{padding:16px}.nav{grid-template-columns:repeat(3,1fr)}.sidefoot{display:none}.main{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.main{padding:12px}.metric{font-size:22px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">✦ Northstar</div><div class="tag">SHOP TOOLS · SMALL BUSINESS</div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="products">▣ Products</button><button data-page="sales">↗ Sales</button><button data-page="expenses">↘ Expenses</button><button data-page="reports">▤ Reports</button><button data-page="settings">⚙ Data & Settings</button></nav><div class="sidefoot">Your shop, organized.<br>Version 1.0 · Local-first</div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub">A clear picture of your shop at a glance.</div></div><div class="actions"><button class="btn" onclick="exportData()">Export backup</button><button class="btn primary" onclick="quickAdd()">＋ Quick add</button></div></header><div id="view"></div><div class="footer">Northstar Shop Tools · Estimates are for planning only. Keep your own records and consult a qualified tax professional for tax advice.</div></main></div>
<dialog id="modal" style="border:0;border-radius:16px;padding:0;width:min(560px,calc(100% - 24px));box-shadow:0 25px 80px #14243a40"><div class="panel" style="border:0;margin:0"><div class="panelhead"><h2 class="section-title" id="modalTitle">Add item</h2><button class="btn" onclick="closeModal()">✕</button></div><form id="modalForm"><div id="modalFields" class="formgrid"></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save record</button></div></form></div></dialog><input id="importFile" type="file" accept="application/json,.json" class="hidden">
<script>
const KEY='northstar_shop_tools_v1';let db=load();let page='dashboard';let editing=null;const titles={dashboard:['Dashboard','A clear picture of your shop at a glance.'],products:['Products','Manage your catalogue and current stock.'],sales:['Sales','Record orders and review revenue.'],expenses:['Expenses','Track the costs of running your shop.'],reports:['Reports','Review performance over a selected period.'],settings:['Data & Settings','Back up your records or restore a previous backup.']};function blank(){return {products:[],sales:[],expenses:[],settings:{currency:'USD',shopName:'My Shop'}}}function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat(undefined,{style:'currency',currency:db.settings.currency||'USD'}).format(Number(n)||0)}function num(v){return Number(v)||0}function today(){return new Date().toISOString().slice(0,10)}function sum(a,fn){return a.reduce((s,x)=>s+fn(x),0)}function cogs(s){const p=db.products.find(p=>p.id===s.productId);return num(s.qty)*num(s.unitCost??p?.cost)}function profit(){return sum(db.sales,s=>num(s.qty)*num(s.price)-cogs(s))-sum(db.expenses,e=>num(e.amount))}function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});function render(){document.getElementById('pageTitle').textContent=titles[page][0];document.getElementById('pageSub').textContent=titles[page][1];const v=document.getElementById('view');if(page==='dashboard')v.innerHTML=dashboard();if(page==='products')v.innerHTML=productsView();if(page==='sales')v.innerHTML=salesView();if(page==='expenses')v.innerHTML=expensesView();if(page==='reports')v.innerHTML=reportsView();if(page==='settings')v.innerHTML=settingsView()}
function dashboard(){const revenue=sum(db.sales,s=>num(s.qty)*num(s.price)),cost=sum(db.sales,cogs),expenses=sum(db.expenses,e=>num(e.amount)),stock=sum(db.products,p=>num(p.stock));const recent=[...db.sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `<div class="grid"><div class="card"><div class="metric-label">Sales revenue</div><div class="metric">${money(revenue)}</div><div class="metric-note">Recorded sales, all dates</div></div><div class="card"><div class="metric-label">Gross profit estimate</div><div class="metric">${money(revenue-cost)}</div><div class="metric-note">Revenue minus recorded product costs</div></div><div class="card"><div class="metric-label">Expenses</div><div class="metric">${money(expenses)}</div><div class="metric-note">All recorded expenses</div></div><div class="card"><div class="metric-label">Items in stock</div><div class="metric">${stock.toLocaleString()}</div><div class="metric-note">Manual stock count</div></div></div><div class="notice">OFFLINE MODE: this version makes no network requests. Your data stays in this browser profile on this device. Use <b>Export backup</b> regularly. Sales do not automatically reduce stock in this starter build; update quantities in Products after a sale.</div><div class="two"><section class="panel"><div class="panelhead"><h2 class="section-title">Recent sales</h2><button class="btn" onclick="setPage('sales')">View sales</button></div>${recent.length?table(['Date','Product','Qty','Revenue'],recent.map(s=>[esc(s.date),esc(productName(s.productId)),s.qty,money(num(s.qty)*num(s.price))])):'<div class="empty">No sales yet. Add your first sale to see activity here.</div>'}</section><section class="panel"><h2 class="section-title">Stock watch</h2>${db.products.length?db.products.slice().sort((a,b)=>num(a.stock)-num(b.stock)).slice(0,6).map(p=>`<div class="barrow"><span>${esc(p.name)}</span><div class="barbg"><div class="barfill" style="width:${Math.min(100,num(p.stock)/Math.max(1,num(p.stock),10)*100)}%"></div></div><span>${num(p.stock)} in stock</span></div>`).join(''):'<div class="empty">Add products to start tracking stock.</div>'}</section></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function productName(id){return db.products.find(p=>p.id===id)?.name||'Deleted product'}function actionBtns(type,id){return `<button class="btn" onclick="editRecord('${type}','${id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('${type}','${id}')">Delete</button>`}
function productsView(){return `<section class="panel"><div class="panelhead"><h2 class="section-title">Product catalogue (${db.products.length})</h2><button class="btn primary" onclick="openForm('products')">＋ Add product</button></div>${db.products.length?table(['Product','SKU / Code','Category','Price','Unit cost','Stock','Actions'],db.products.map(p=>[esc(p.name),esc(p.sku||'—'),esc(p.category||'—'),money(p.price),money(p.cost),`${num(p.stock)} ${num(p.stock)<=num(p.lowStock)?'<span class="pill low">Low</span>':''}`,actionBtns('products',p.id)])):'<div class="empty">No products yet. Add your first product.</div>'}</section>`}
function salesView(){return `<section class="panel"><div class="panelhead"><h2 class="section-title">Sales records (${db.sales.length})</h2><button class="btn primary" onclick="openForm('sales')">＋ Record sale</button></div>${db.sales.length?table(['Date','Product','Customer / Ref','Qty','Unit price','Revenue','Actions'],db.sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>[esc(s.date),esc(productName(s.productId)),esc(s.customer||'—'),num(s.qty),money(s.price),money(num(s.qty)*num(s.price)),actionBtns('sales',s.id)])):'<div class="empty">No sales recorded yet.</div>'}</section>`}
function expensesView(){return `<section class="panel"><div class="panelhead"><h2 class="section-title">Expenses (${db.expenses.length})</h2><button class="btn primary" onclick="openForm('expenses')">＋ Add expense</button></div>${db.expenses.length?table(['Date','Description','Category','Amount','Actions'],db.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>[esc(e.date),esc(e.description),esc(e.category||'Other'),money(e.amount),actionBtns('expenses',e.id)])):'<div class="empty">No expenses recorded yet.</div>'}</section>`}
function reportsView(){const rev=sum(db.sales,s=>num(s.qty)*num(s.price)),cost=sum(db.sales,cogs),ex=sum(db.expenses,e=>num(e.amount));const months={};[...db.sales.map(s=>({date:s.date,value:num(s.qty)*num(s.price),type:'Sales'})),...db.expenses.map(e=>({date:e.date,value:num(e.amount),type:'Expenses'}))].forEach(x=>{const k=(x.date||'Undated').slice(0,7);months[k]??={sales:0,expenses:0};months[k][x.type.toLowerCase()]+=x.value});return `<div class="grid"><div class="card"><div class="metric-label">Total revenue</div><div class="metric">${money(rev)}</div></div><div class="card"><div class="metric-label">Estimated cost of goods sold</div><div class="metric">${money(cost)}</div></div><div class="card"><div class="metric-label">Recorded expenses</div><div class="metric">${money(ex)}</div></div><div class="card"><div class="metric-label">Estimated net after costs & expenses</div><div class="metric">${money(rev-cost-ex)}</div></div></div><section class="panel"><h2 class="section-title">Monthly summary</h2>${Object.keys(months).length?table(['Month','Sales revenue','Expenses','Difference before product costs'],Object.entries(months).sort(([a],[b])=>b.localeCompare(a)).map(([m,x])=>[esc(m),money(x.sales),money(x.expenses),money(x.sales-x.expenses)])):'<div class="empty">Monthly totals will appear when you record sales or expenses.</div>'}<p class="sub">Estimates only. This report is not a tax return or formal accounting statement.</p></section>`}
function settingsView(){return `<section class="panel"><h2 class="section-title">Shop settings</h2><form onsubmit="saveSettings(event)"><div class="formgrid"><label>Shop name<input name="shopName" value="${esc(db.settings.shopName)}" required></label><label>Currency<select name="currency">${['USD','EUR','GBP','LBP','CAD','AUD'].map(c=>`<option ${db.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></label></div><div class="form-actions"><button class="btn primary">Save settings</button></div></form></section><section class="panel"><h2 class="section-title">Backup & restore</h2><p>Export a JSON backup to keep a copy of your products, sales, expenses and settings. Store the backup somewhere safe.</p><div class="actions"><button class="btn primary" onclick="exportData()">Export backup (.json)</button><button class="btn" onclick="document.getElementById('importFile').click()">Restore from backup</button><button class="btn danger" onclick="clearData()">Clear all app data</button></div><p class="sub">Restore replaces the current data. Export a backup first if you want to keep the current records.</p></section><section class="panel"><h2 class="section-title">About this version</h2><p>Northstar Shop Tools 1.1 · Offline starter build.</p><p class="sub">Works without internet and makes no cloud connection. This starter stores records in browser local storage on this computer. Keep regular JSON backups. Browser data can be lost if browser storage is cleared; the production Microsoft Store version should use a dedicated local database and be tested for updates and recovery.</p></section>`}
function field(label,name,type='text',required=true,extra=''){return `<label>${label}<input name="${name}" type="${type}" ${required?'required':''} ${extra}></label>`}function selectField(label,name,options,required=true){return `<label>${label}<select name="${name}" ${required?'required':''}>${options.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select></label>`}
function openForm(type,id=null){editing=id;const rec=id?db[type].find(x=>x.id===id):{};document.getElementById('modalTitle').textContent=(id?'Edit ':'Add ')+({products:'product',sales:'sale',expenses:'expense'}[type]);let html='';if(type==='products')html=field('Product name','name')+field('SKU / product code','sku','text',false)+field('Category','category','text',false)+field('Selling price','price','number',true,'min="0" step="0.01"')+field('Unit cost','cost','number',true,'min="0" step="0.01"')+field('Stock quantity','stock','number',true,'min="0" step="1"')+field('Low stock alert at','lowStock','number',true,'min="0" step="1"');if(type==='sales')html=field('Sale date','date','date',true)+selectField('Product','productId',db.products.map(p=>({value:p.id,label:p.name})))+field('Customer / order reference','customer','text',false)+field('Quantity','qty','number',true,'min="1" step="1"')+field('Unit selling price','price','number',true,'min="0" step="0.01"')+field('Unit cost at sale (optional override)','unitCost','number',false,'min="0" step="0.01"');if(type==='expenses')html=field('Expense date','date','date',true)+field('Description','description')+selectField('Category','category',['Rent','Supplies','Shipping','Marketing','Utilities','Software','Other'].map(x=>({value:x,label:x})))+field('Amount','amount','number',true,'min="0" step="0.01"');const box=document.getElementById('modalFields');box.innerHTML=html;const form=document.getElementById('modalForm');form.dataset.type=type;for(const [k,v] of Object.entries(rec||{})){const el=form.elements[k];if(el&&v!==undefined)el.value=v}if(!id){if(form.elements.date)form.elements.date.value=today();if(type==='sales'&&form.elements.productId?.options.length){const p=db.products.find(x=>x.id===form.elements.productId.value);if(p)form.elements.price.value=p.price}if(type==='products'){form.elements.stock.value=0;form.elements.lowStock.value=3}}form.elements.productId?.addEventListener('change',()=>{if(!editing){const p=db.products.find(x=>x.id===form.elements.productId.value);if(p)form.elements.price.value=p.price}});if(type==='sales'&&!db.products.length){closeModal();alert('Please add a product before recording a sale.');return}document.getElementById('modal').showModal()}
function closeModal(){document.getElementById('modal').close()}document.getElementById('modalForm').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget,type=form.dataset.type,fd=new FormData(form),obj=Object.fromEntries(fd.entries());for(const k of ['price','cost','stock','lowStock','qty','unitCost','amount'])if(obj[k]!==undefined&&obj[k]!=='')obj[k]=Number(obj[k]);if(obj.unitCost==='')delete obj.unitCost;if(type==='sales'&&!obj.productId){alert('Choose a product.');return}if(editing){const i=db[type].findIndex(x=>x.id===editing);if(i>=0)db[type][i]={...db[type][i],...obj}}else db[type].push({id:crypto.randomUUID(),...obj});closeModal();save()});function editRecord(type,id){openForm(type,id)}function deleteRecord(type,id){if(!confirm('Delete this record? This cannot be undone unless you have a backup.'))return;db[type]=db[type].filter(x=>x.id!==id);save()}function quickAdd(){if(page==='products'||page==='sales'||page==='expenses')openForm(page);else{const choice=prompt('What would you like to add? Type product, sale, or expense.');if(choice&&['product','sale','expense'].includes(choice.toLowerCase()))openForm(({product:'products',sale:'sales',expense:'expenses'})[choice.toLowerCase()]);else if(choice)alert('Please enter product, sale, or expense.')}}function saveSettings(e){e.preventDefault();const fd=new FormData(e.target);db.settings={shopName:fd.get('shopName'),currency:fd.get('currency')};save();alert('Settings saved.')}function exportData(){const blob=new Blob([JSON.stringify({app:'Northstar Shop Tools',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='northstar-shop-tools-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text()),data=x.data||x;if(!Array.isArray(data.products)||!Array.isArray(data.sales)||!Array.isArray(data.expenses))throw Error('This does not look like a Northstar backup.');if(!confirm('Restore this backup and replace current records?'))return;db={...blank(),...data};save();alert('Backup restored.')}catch(err){alert('Could not restore backup: '+err.message)}finally{e.target.value=''}});function clearData(){if(confirm('Delete ALL products, sales, expenses and settings from this app? Export a backup first if needed.')){db=blank();save()}}render();
</script></body></html>
